# Fly.io config cho TPAgent. Dùng:  fly launch --no-deploy -c deploy/fly.toml  (hoặc copy ra gốc repo)
# Đổi "app" thành tên anh chọn (duy nhất toàn Fly). Region sin = Singapore.
app = "tpagent"
primary_region = "sin"

[build]
  dockerfile = "../Dockerfile"   # nếu copy file này ra gốc repo, đổi thành "Dockerfile"

[env]
  PORT = "8080"
  HOME = "/data"
  TPAGENT_HOME = "/data"
  TPAGENT_WORKSPACE = "/data/workspace"
  TPAGENT_BROWSER_HEADLESS = "1"
  TPAGENT_ENABLED_TOOLS = "browser,video,subagent"
  # ANTHROPIC_API_KEY và TPAGENT_TOKEN: dùng `fly secrets set`, KHÔNG ghi ở đây.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # tắt máy khi không dùng -> gần như không tốn tiền lúc rảnh
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "tpagent_data"          # tạo trước: fly volumes create tpagent_data --region sin --size 3
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                   # Chromium cần >= 1GB; 2gb nếu edit video nhiều
