[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpagent"
version = "0.1.0"
description = "TPAgent - a cheap, open-source Claude-Code-like coding/automation agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vu Trung Tuan" }]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
computer = ["pyautogui>=0.9.54", "mss>=9.0", "pillow>=10.0"]
video = ["faster-whisper>=1.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "websockets>=12"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tpagent = "tpagent.cli:main"

[tool.setuptools.packages.find]
include = ["tpagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
