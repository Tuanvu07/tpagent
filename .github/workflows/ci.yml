name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # web extra có thể chưa tồn tại trong pyproject; cài tường minh để test server chạy được
          pip install -e ".[web]" 2>/dev/null || true
          pip install fastapi "uvicorn[standard]" python-multipart websockets httpx
      - name: Run tests
        env:
          TPAGENT_PROVIDER: fake
        run: python -m pytest tests -q
      - name: Import server module (nếu đã có)
        run: |
          if [ -f tpagent/server/__main__.py ]; then python -c "import tpagent.server"; else echo "tpagent/server chưa có, bỏ qua"; fi

  docker:
    name: docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tpagent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (fake provider)
        run: |
          docker run -d --name tpagent -e TPAGENT_PROVIDER=fake -e TPAGENT_TOKEN=test -p 8080:8080 tpagent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "server up"; docker logs tpagent | head -40; exit 0
            fi
            sleep 2
          done
          echo "server did not come up"; docker logs tpagent; exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f tpagent || true
